title: Never Your Sounds
description: Your entire audio world. One place. Discover audio resources, use browser tools, and build your craft with guided learning paths.
url: https://jay-lokhande.github.io
baseurl: /never-your-sounds
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
defaults:
  - scope:
      path: site
    values:
      layout: page
  - scope:
      path: browse.html
    values:
      layout: page
