name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON catalog
        run: python3 scripts/validate-catalog.py
      - name: Test catalogue validation failures
        run: python3 scripts/test-validator.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test audio tools, catalogue, Studio, and Hip-Hop Hub
        run: npm test
